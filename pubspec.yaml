name: saferoute
description: SafeRoute App

publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^8.0.2
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  http: ^1.1.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_app_check: ^0.4.3
  firebase_messaging: ^16.2.0
  flutter_polyline_points: ^3.1.0
  intl: ^0.20.2
  url_launcher: ^6.2.0
  share_plus: ^12.0.2
  permission_handler: ^12.0.1
  equatable: ^2.0.5
  provider: ^6.1.1
  google_sign_in: ^7.2.0
  image_picker: ^1.0.4
  firebase_storage: ^13.3.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
